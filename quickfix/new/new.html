<div class="row">
  <div class="card-body">
    <div class="table-responsive daily-table">
      <table class="table table-bordered arrival-table property-table">
        <thead>
          <tr>
            <th>Details</th>
            <th style="text-align: right;"><span id="CurrentDateTime"></span></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Issued to Dept.</td>
            <td>
              <select name="" id="issued-to-team" class="form-select" oninput="DepartmentChange()">
                <option value="0">Back of the House</option>
                <option value="1">BBBB</option>
                <option value="2">CCCC</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Issued By</td>
            <td>
              <!--<select name="" id="issued-by-team" class="form-select" oninput="DepartmentChange()"></select>  -->
              <input class="form-control" type="text" name="login" id="issued-by-team"
                placeholder="by Default  from user login Position Name, Dept." readonly>
            </td>
          </tr>
          <tr>
            <td>Area</td>
            <td>
              <select name="" id="issued-to-area" class="form-select">
                <option value="0">Public Area</option>
                <option value="1">BBBB</option>
                <option value="2">CCCC</option>
                <option value="3">Other</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Sub-Area</td>
            <td>
              <input class="form-control" type="text" name="Subarea" id="Subarea" placeholder="Subarea">
            </td>
          </tr>
          <tr>
            <td>Job Details</td>
            <td>
              <input class="form-control" type="text" name="job-details" id="job-details"
                placeholder="Enter job detail ">
            </td>
          </tr>
          <tr id="deptAssignRow">
            <td>Assign (Dept.)</td>
            <td>
              <select name="" id="TeamAssignRow" class="form-select" oninput="SubTeamChange()">

              </select>
            </td>
          </tr>
          <tr id="supervisorAssignRow">
            <td>Assign (Supervisor)</td>
            <td>
              <select name="" id="supervisorAssigndto" class="form-select">

              </select>
            </td>
          </tr>
          <tr>
            <td>Photo (Size Limit: 5MB)</td>
            <td>
              <div class="upload">
                <label class="upload-area">
                  <input id="job-photo" type="file" accept=".jpeg, .jpg, .png, .mp4, .mov" multiple onchange="previewImage(event)">
                  <span class="upload-button">
                    <i class="fas fa-upload"></i>
                  </span>
                </label>
                <div id="preview-container" style="margin-left: 5px; display:flex; gap:8px; flex-wrap:wrap;"></div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div id="subteamcount-span"></div>
    </div>
    <div class="col-md-12">
      <div class="both-btns float-end mt-3 mb-4">
        <div class="export-btns">
          <button class="btn btn-linkedin" id="submit-new-job-btn" onclick="SubmitDailyJob()">Submit</button>
        </div>
        <div class="export-btns">
          <button class="btn btn-dark">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="new/new.js"></script>
