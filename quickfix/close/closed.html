<!-- Mobile Design -->
<div class="mobileview">
  <div class="d-flex align-items-center gap-2 mb-2">
    <input class="form-control" type="text" name="Search" id="Search" placeholder="Search" oninput="SearchCloseJobs()">
    <select id="mobile-close-pagesize" class="form-select form-select-sm" style="width: auto; min-width: 90px;" onchange="ChangeClosePageSize(this.value)">
      <option value="25">25 rows</option>
      <option value="50">50 rows</option>
      <option value="100">100 rows</option>
      <option value="200">200 rows</option>
    </select>
  </div>
  <div class="accordion1" id="close-card-view">
  </div>
</div>

<!-- Desktop Design -->
<div class="card-body py-2">
  <div class="table-responsive tablehide">
    <table id="closejobstable" class="table table-sm table-hover "
      style="font-size: 12px; width:100%; text-align: initial;" cellspacing="0">
      <thead class="cf">
        <tr>
          <th>Sr.No.</th>
          <th>Job Details</th>
          <th>Issued By</th>
          <th>Issued To</th>
          <th>Area</th>
          <th>Sub-Area</th>
          <th class="w-px-300">Open Date/Time</th>
          <th>Photo Before</th>
          <th>Photo After</th>
          <th>Closed By</th>
          <th class="w-px-300">Closed Date/Time</th>
          <th>Status</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody id="close-table-view">
      </tbody>
    </table>
  </div>
</div>
<div class="col-md-12">
  <div id="close-pagination-container" class="d-flex justify-content-between align-items-center mt-3 mb-4 px-2 flex-wrap gap-2">
  </div>
</div>


<style>
   
    #closejobstable th,
    #closejobstable td {
        width: 140px !important;
        min-width: 120px !important;
        max-width: 180px !important;
        white-space: normal !important;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    #closejobstable thead th select {
        width: 130px !important;
        max-width: 130px !important;
    }

    .dt-container .row:first-child,
    .dataTables_wrapper .row:first-child {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        margin-bottom: 10px !important;
        flex-wrap: wrap !important;
        gap: 8px !important;
    }
    .custom-pagesize-container select {
        cursor: pointer;
    }
</style>
<script src="close/closed.js"></script>
