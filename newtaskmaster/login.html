<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkWize | Login</title>
  <!-- ss -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#f4f7fb] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[420px]">
    
    <!-- Login Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl shadow-blue-900/5 p-8 sm:p-9">
      
      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <a href="dashboard.html" class="inline-block mb-3">
          <img src="assets/logo.png" alt="WorkWize Logo" class="h-10 mx-auto object-contain">
        </a>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Login</h2>
      </div>

      <!-- Error Box -->
      <div id="loginError" class="hidden mb-4 p-2.5 rounded-lg text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200 text-center"></div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <!-- Email id Field -->
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">Email id</label>
          <div class="relative flex items-center">
            <i class="fa-regular fa-envelope absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="text" 
              id="username" 
              name="Username"
              required 
              placeholder="Registered E-Mail ID"
              class="w-full pl-10 pr-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
          <div class="relative flex items-center">
            <i class="fa-solid fa-lock absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="password" 
              id="password" 
              name="Password"
              required 
              placeholder="*************"
              class="w-full pl-10 pr-10 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800"
            >
            <button 
              type="button" 
              onclick="togglePassword()" 
              class="absolute right-3 text-slate-400 hover:text-slate-600 p-1 text-xs" 
              title="Show/Hide Password"
            >
              <i class="fa-regular fa-eye" id="pwdEye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center justify-between pt-0.5 text-xs">
          <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600">
            <input type="checkbox" id="rememberMe" class="w-3.5 h-3.5 rounded text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer">
            <span>Remember Me</span>
          </label>
        </div>

        <!-- Log In Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="loginBtn"
            class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs font-semibold rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
          >
            <span>Log In</span>
          </button>
        </div>

        <!-- Forgot Password Link Below Log In Button -->
        <div class="text-center pt-2">
          <a href="forgot-password.html" onclick="openForgotPasswordModal(event)" class="text-xs text-blue-600 hover:text-blue-800 hover:underline font-semibold inline-flex items-center gap-1.5 transition-colors">
            <i class="fa-solid fa-lock-open text-[11px]"></i>
            <span>Forgot Password?</span>
          </a>
        </div>
      </form>

      <!-- Subtle Divider -->
      <div class="my-5 border-t border-slate-100"></div>

      <!-- Login For Admin Panel Text -->
      <div class="text-center">
        <span class="text-xs text-blue-600 font-semibold inline-flex items-center gap-1.5 cursor-default select-none">
          <i class="fa-solid fa-user-shield text-[11px]"></i>
          <span>Login For Admin Panel</span>
        </span>
      </div>

    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const eye = document.getElementById('pwdEye');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const err = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        err.innerText = 'Please enter both Email and Password.';
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Logging In...</span>';

      try {
        // Authenticate with Real Backend API via 'taskmaster' app type (Mirrors taskmaster loginUser)
        const response = await WorkWizeAPI.login(username, password, 'taskmaster');
        if (response && response.success) {
          btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> <span>Success! Redirecting...</span>';
          btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btn.classList.add('bg-emerald-600');
          setTimeout(() => {
            window.location.href = 'job-by-area.html';
          }, 400);
          return;
        } else {
          throw new Error('Invalid credentials');
        }
      } catch (error) {
        // Exactly mirrors taskmaster: $('#login-errors').text('Invalid credentials')
        err.innerText = 'Invalid credentials';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Log In</span>';
      }
    }
  </script>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 transition-all duration-200 opacity-0 pointer-events-none">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden transform scale-95 transition-all duration-200">
      <!-- Modal Header -->
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-envelope-open-text"></i>
          </div>
          <div>
            <h3 class="font-bold text-slate-900 text-sm">Forgot Password</h3>
            <p class="text-[11px] text-slate-400">Request a password reset link</p>
          </div>
        </div>
        <button type="button" onclick="closeForgotPasswordModal()" class="w-7 h-7 rounded-lg hover:bg-slate-200 text-slate-400 hover:text-slate-600 flex items-center justify-center cursor-pointer">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <form id="forgotPasswordForm" class="p-6 space-y-4 text-xs" onsubmit="handleForgotPasswordSubmit(event)">
        <p class="text-slate-600 leading-relaxed text-xs">
          Enter your registered Email ID. We will send you a secure link to reset your password.
        </p>

        <div id="forgotError" class="hidden p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 font-semibold text-center"></div>
        <div id="forgotSuccess" class="hidden p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-center leading-relaxed"></div>

        <div>
          <label for="forgotEmail" class="block font-semibold text-slate-700 mb-1.5">Registered Email ID</label>
          <div class="relative flex items-center">
            <i class="fa-regular fa-envelope absolute left-3.5 text-slate-400 text-xs pointer-events-none"></i>
            <input 
              type="email" 
              id="forgotEmail" 
              required 
              placeholder="e.g. it@workwise.in"
              class="w-full pl-9 pr-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800 font-medium"
            >
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold cursor-pointer">Cancel</button>
          <button type="submit" id="forgotSubmitBtn" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold flex items-center gap-1.5 shadow-sm cursor-pointer">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>Send Reset Link</span>
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
