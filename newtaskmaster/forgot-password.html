<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkWize | Forgot Password</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#f4f7fb] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[420px]">
    
    <!-- Forgot Password Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl shadow-blue-900/5 p-8 sm:p-9">
      
      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <a href="login.html" class="inline-block mb-3">
          <img src="assets/logo.png" alt="WorkWize Logo" class="h-10 mx-auto object-contain">
        </a>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Forgot Password</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your registered email to receive a password reset link.</p>
      </div>

      <!-- Alerts -->
      <div id="forgotError" class="hidden mb-4 p-2.5 rounded-xl text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200 text-center"></div>
      <div id="forgotSuccess" class="hidden mb-4 p-3 rounded-xl text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 text-center leading-relaxed"></div>

      <!-- Forgot Password Form -->
      <form id="forgotForm" class="space-y-4" onsubmit="handleForgot(event)">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Registered Email ID</label>
          <div class="relative flex items-center">
            <i class="fa-regular fa-envelope absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="email" 
              id="email" 
              name="email"
              required 
              placeholder="e.g. it@workwise.in"
              class="w-full pl-10 pr-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800"
            >
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="forgotBtn"
            class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs font-semibold rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
          >
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>Send Reset Link</span>
          </button>
        </div>
      </form>

      <!-- Back to Login Link -->
      <div class="my-5 border-t border-slate-100"></div>

      <div class="text-center">
        <a href="login.html" class="text-xs text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-arrow-left text-[11px]"></i>
          <span>Back to Login</span>
        </a>
      </div>

    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const err = document.getElementById('forgotError');
      const success = document.getElementById('forgotSuccess');
      const btn = document.getElementById('forgotBtn');

      if (!email) {
        err.innerText = 'Please enter your registered Email ID.';
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      success.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Sending Link...</span>';

      try {
        const response = await WorkWizeAPI.forgotPassword(email);
        if (response === true || response?.success === true || response?.status === true) {
          success.innerHTML = `
            <div class="flex flex-col items-center gap-1.5">
              <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
              <span class="font-bold">Reset Link Sent!</span>
              <span class="text-[11px] text-slate-600">A password reset link has been dispatched to <b>${email}</b>. Please check your inbox and follow the link.</span>
            </div>
          `;
          success.classList.remove('hidden');
          btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> <span>Sent!</span>';
          btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btn.classList.add('bg-emerald-600');
        } else {
          throw new Error('User not found or unable to dispatch reset link.');
        }
      } catch (error) {
        err.innerText = error.message || 'User not found or unable to send email. Please check your email and try again.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane text-xs"></i> <span>Send Reset Link</span>';
        btn.classList.remove('bg-emerald-600');
        btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
      }
    }
  </script>
</body>
</html>
