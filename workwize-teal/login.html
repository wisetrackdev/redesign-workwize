<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkWize | Login</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-body {
      background: linear-gradient(135deg, #EBF1FD 0%, #DDE6FA 50%, #E8F4E6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(64, 88, 166, 0.12), 0 2px 6px rgba(0,0,0,0.04);
      padding: 36px 32px;
      border: 1px solid #E3E8F5;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand .logo-img {
      height: 48px;
      margin-bottom: 12px;
    }
    .login-brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .login-brand p {
      font-size: 13.5px;
      color: var(--muted);
    }
    .login-fld {
      margin-bottom: 18px;
    }
    .login-fld label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      background: #FAFCFF;
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    .input-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(64, 88, 166, 0.15);
    }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex;
      padding: 4px;
    }
    .pwd-toggle:hover {
      color: var(--primary);
    }
    .login-btn {
      width: 100%;
      height: 46px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(64, 88, 166, 0.35);
      transition: background .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: var(--primary-dark);
    }
    .login-btn:active {
      transform: scale(0.99);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .login-error {
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 14px;
      min-height: 20px;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/logo.png" alt="WorkWize" class="logo-img">
        <h1>Sign In</h1>
        <p>Enter your credentials to access WorkWize Daily Jobs</p>
      </div>

      <!-- Active Session Banner -->
      <div id="alreadyLoggedInBanner" style="display:none; background:#EFF6FF; border:1px solid #BFDBFE; border-radius:10px; padding:12px 14px; margin-bottom:18px; font-size:13px; color:#1E40AF; align-items:center; justify-content:space-between; gap:10px;">
        <div>
          <span>Logged in as: <strong id="loggedInUserLabel">User</strong></span>
        </div>
        <a href="index.html" style="color:#2563EB; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:4px; font-size:12.5px;">
          Go to Jobs &rarr;
        </a>
      </div>

      <form id="loginForm" novalidate>
        <div class="login-fld">
          <label for="username">Email or Username</label>
          <div class="input-wrap">
            <input type="text" id="username" placeholder="e.g. it@workwize.com" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="login-fld">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="signInBtn">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <div class="login-error" id="loginErrors"></div>
      </form>
    </div>

    <div class="login-footer">
      &copy; 2023-2026 WorkWize . Efficiency Redefined
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="api/config.js"></script>
  <script src="api/dailyJobApi.js"></script>
  <script>
    (function () {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const signInBtn = document.getElementById('signInBtn');
      const loginErrors = document.getElementById('loginErrors');
      const pwdToggle = document.getElementById('pwdToggle');
      const toastEl = document.getElementById('toast');

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2500);
      }

      // Toggle password visibility
      if (pwdToggle) {
        pwdToggle.addEventListener('click', function () {
          const type = passwordInput.type === 'password' ? 'text' : 'password';
          passwordInput.type = type;
        });
      }

      // Check existing session
      try {
        const stored = localStorage.getItem('oproUserData');
        if (stored) {
          const u = JSON.parse(stored);
          if (u && (u.name || u.username) && (u.jwt || u.token)) {
            const banner = document.getElementById('alreadyLoggedInBanner');
            const label = document.getElementById('loggedInUserLabel');
            if (banner && label) {
              label.textContent = (u.name || u.username) + ' (' + (u.desg || 'Logged in') + ')';
              banner.style.display = 'flex';
            }
          }
        }
      } catch (err) {}

      // Login form submission
      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
          loginErrors.textContent = 'Please enter both username and password.';
          return;
        }

        loginErrors.textContent = '';
        signInBtn.disabled = true;
        signInBtn.innerHTML = 'Signing in...';

        try {
          if (!window.WorkWizeDailyJobApi || typeof window.WorkWizeDailyJobApi.login !== 'function') {
            throw new Error('Login service is unavailable. Please refresh and try again.');
          }

          await window.WorkWizeDailyJobApi.login(username, password, 'quickfix');

          showToast('Login successful! Redirecting...');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 400);
        } catch (err) {
          console.error('[Login Error]:', err);
          let msg = err.message || 'Login failed. Please try again.';
          if (msg === 'UNAUTHORIZED' || msg.toLowerCase().includes('401') || msg.toLowerCase().includes('invalid credentials')) {
            msg = 'Invalid email/username or password. Please try again.';
          }
          loginErrors.textContent = msg;
          signInBtn.disabled = false;
          signInBtn.innerHTML = '<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
        }
      });
    })();
  </script>
</body>
</html>
