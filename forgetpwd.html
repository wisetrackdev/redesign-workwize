<!DOCTYPE html>

<html
  lang="en"
  class="light-style customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="admin/admincssjs/theme/assets/"
  data-template="vertical-menu-template"
  
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>WorkWize | Login</title>

    <meta name="description" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="admin/admincssjs/theme/assets/img/AppImages/logo.jpeg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

  

    <!-- Icons -->
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/fonts/boxicons.css" />
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/fonts/fontawesome.css" />
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/fonts/flag-icons.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/css/rtl/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/css/rtl/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/css/demo.css" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/libs/typeahead-js/typeahead.css" />
    <!-- Vendor -->
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/libs/formvalidation/dist/css/formValidation.min.css" />

    <!-- Page CSS -->
    <!-- Page -->
    <link rel="stylesheet" href="admin/admincssjs/theme/assets/vendor/css/pages/page-auth.css" />
    <!-- Helpers -->
    <script src="admin/admincssjs/theme/assets/vendor/js/helpers.js"></script>

    <!--! Template customizer & Theme config files MUST be included after core stylesheets and helpers.js in the <head> section -->
    <!--? Template customizer: To hide customizer set displayCustomizer value false in config.js.  -->
    <script src="admin/admincssjs/theme/assets/vendor/js/template-customizer.js"></script>
    <!--? Config:  Mandatory theme config file contain global vars & default theme options, Set your preferred theme option in this file.  -->
    <script src="admin/admincssjs/theme/assets/js/config.js"></script>

    <link rel="stylesheet" href="/commons/systemjscss/cs/opro.css">
    <link rel="stylesheet" href="webessential/LoadingSpin.css">
  </head>

  <body class="bglogins">
    <!-- Content -->

    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner py-4">
          <!-- Forgot Password -->
          <div class="card">
            <div class="card-body">
              <!-- Logo -->
              <div class="app-brand justify-content-center">
                <a href="" class="app-brand-link gap-2">
                  <img src="admin/admincssjs/assets/images/logo.png" alt="Opro" title="Opro" width="90%"/>
                </a>
              </div>
              <!-- /Logo -->
              <h4 class="mb-2">Forgot Password? 🔒</h4>
              <p class="mb-4">Enter your email and we'll send you instructions to reset your password</p>
              <div id="formAuthentication" class="mb-3">
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="text"
                    class="form-control breq-field"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autofocus
                  />
                </div>
                <button class="btn btn-primary d-grid w-100" onclick="ForgetPassword()">Send Reset Link</button>
                <div id="forget-validation-message"></div>
              </div>
              <div class="text-center">
                <a href="../../index.html" class="d-flex align-items-center justify-content-center">
                  <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
                  Back to login
                </a>
              </div>
            </div>
          </div>
          <!-- /Forgot Password -->
        </div>
      </div>
    </div>

    <!-- / Content -->
    <div id="SpinnerLoader" style="margin: 0 auto; display:none;z-index:999999"></div>
    <!-- Core JS -->
    <!-- build:js admin/admincssjs/theme/assets/vendor/js/core.js -->
    <script src="admin/admincssjs/theme/assets/vendor/libs/jquery/jquery.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/popper/popper.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/js/bootstrap.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>

    <script src="admin/admincssjs/theme/assets/vendor/libs/hammer/hammer.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/i18n/i18n.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/typeahead-js/typeahead.js"></script>

    <script src="admin/admincssjs/theme/assets/vendor/js/menu.js"></script>
    <!-- endbuild -->

    <!-- Vendors JS -->
    <script src="admin/admincssjs/theme/assets/vendor/libs/formvalidation/dist/js/FormValidation.min.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/formvalidation/dist/js/plugins/Bootstrap5.min.js"></script>
    <script src="admin/admincssjs/theme/assets/vendor/libs/formvalidation/dist/js/plugins/AutoFocus.min.js"></script>

    <!-- Main JS -->
    <script src="admin/admincssjs/theme/assets/js/main.js"></script>

    <!-- Page JS -->
    <script src="admin/admincssjs/theme/assets/js/pages-auth.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
    <script src="/webessential/domain.js"></script>
    <script src="/webessential/resetpassword.js"></script>

  </body>
</html>
