<div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="public" role="tabpanel" aria-labelledby="public-tab">

        <!-- Info Card with new professional styling -->
        <div class="info-card">
            <div class="info-card-header">
                <img class="info-card-img" src="main/images/task-management.png" alt="Task Management">
                <div>
                    <h4 class="info-card-title"><span id="area-name"></span> Inspection Report</h4>
                   
                    <p class="text-muted mb-0"><span id="area-name2"></span></p>
                </div>
            </div>
            <div class="info-stats">
                <div class="info-stat-item">
                    <span class="info-stat-label">Inspection by</span>
                    <span class="info-stat-value" id="sc_inspectby">-</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label">Inspection Date</span>
                    <span class="info-stat-value" id="sc_inspectdate">-</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label">Score</span>
                    <span class="info-stat-value" id="sc_score">0%</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-excellent">Excellent</span>
                    <span class="info-stat-value" id="sc_excel">0</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-safety">Safety Issue</span>
                    <span class="info-stat-value" id="sc_safty">0</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-good">Good</span>
                    <span class="info-stat-value" id="sc_good">0</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-satisfactory">Satisfactory</span>
                    <span class="info-stat-value" id="sc_satis">0</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-unsatisfactory">Unsatisfactory</span>
                    <span class="info-stat-value" id="sc_unsatis">0</span>
                </div>
                <div class="info-stat-item">
                    <span class="info-stat-label status-poor">Poor</span>
                    <span class="info-stat-value" id="sc_poor">0</span>
                </div>
            </div>

            <!-- Add New Subarea Section -->
            <div class="add-section mt-3">
                <input type="text" class="add-input" style="flex: 1;" placeholder="Enter new subarea name" id="newSubareaInput">
                <button class="btn-add" onclick="AddNewSubarea()">
                    <i class="fa fa-plus"></i> Add Subarea
                </button>
            </div>
        </div>

        <!-- Subarea Tabs -->
        <div id="subarealist-div"></div>

        <!-- Checklist Content -->
        <div id="subareachecklist-div"></div>
    </div>
</div>
