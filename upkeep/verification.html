<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkWize | Verification</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="main/css/bootstrap.min.css" rel="stylesheet">
    <link href="main/css/style.css" rel="stylesheet">
    <link href="main/css/responsive.css" rel="stylesheet">
</head>

<body>
    <section class="FormsBg d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="FormsContainer">
                <div class="logo">
                    <a href="index.html">
                        <img class="d-block m-auto" src="main/images/logo.png" alt="" />
                    </a>
                </div>
                <div class="heading mt-md-3">Verification</div>
                <p class="text-center forgotContent">We will send you a One Time Password on your <br> phone number</p>
                <form action="" class="form LoginForm px-md-5 pt-md-2">
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Mobile Number</label>
                        <input required="" class="input" type="text" name="mobile" id="mobile"
                            placeholder="Username or E-mail">
                    </div>
                    <input class="FormsButton" type="submit" value="Get Otp">
                </form>
                <!-- <span class="agreement pb-md-5"><i class="fa-solid fa-chevron-left"></i> Back<a href="Login.html"> Log In</a></span> -->
            </div>
        </div>
    </section>

    <!-- All JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main/js/popper.min.js"></script>
    <script src="main/js/bootstrap.min.js"></script>
    <script src="main/js/demo.js"></script>
</body>

</html>
