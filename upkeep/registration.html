<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkWize | Registration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="main/css/bootstrap.min.css" rel="stylesheet">
    <link href="main/css/style.css" rel="stylesheet">
    <link href="main/css/responsive.css" rel="stylesheet">
</head>

<body>
    <section class="RegBg d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="FormsContainer">
                <div class="logo">
                    <a href="index.html">
                        <img class="d-block m-auto" src="main/images/logo.png" alt="" />
                    </a>
                </div>
                <div class="heading mt-md-3">Registration</div>
                <form action="" class="form LoginForm px-md-5">
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Full Name</label>
                        <input required="" class="input" type="text" name="name" id="name" placeholder="Full Name">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Email ID</label>
                        <input required="" class="input" type="email" name="email" id="email" placeholder="Email ID...">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Mobile Number</label>
                        <input required="" class="input" type="number" name="mobile" id="mobile"
                            placeholder="Mobile Number">
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">OTP</label>
                        <input required="" class="input" type="number" name="otp" id="otp" placeholder="Enter Otp">
                    </div>
                    <div class="FormsField" style="text-align: end;">
                        <a href="#">Resend Otp</a>
                    </div>
                    <div class="FormsField">
                        <label class="FormsLabel" for="name">Password</label>
                        <input required="" class="input" type="password" name="Password" id="Password"
                            placeholder="*************">
                    </div>
                    <div class="row">
                        <div class="col-12 pt-3">
                            <input type="checkbox" /><span class="mx-1">I agree all statements in Terms of
                                service</span>
                        </div>
                    </div>
                    <input class="FormsButton" type="submit" value="Registration">
                </form>
                <span class="agreement">Already have an account<a href="login.html"> Login</a></span>
            </div>
        </div>
    </section>
    <!-- All JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main/js/popper.min.js"></script>
    <script src="main/js/bootstrap.min.js"></script>
    <script src="main/js/demo.js"></script>
</body>
</html>
