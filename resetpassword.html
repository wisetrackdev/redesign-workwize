<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkWize | Reset Password</title>
  <link rel="icon" type="image/jpeg" href="newtaskmaster/assets/logo.jpeg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-[#f4f7fb] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-[420px]">
    
    <!-- Reset Password Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl shadow-blue-900/5 p-8 sm:p-9">
      
      <!-- Brand Logo -->
      <div class="text-center mb-6">
        <a href="newtaskmaster/login.html" class="inline-block mb-3">
          <img src="newtaskmaster/assets/logo.png" alt="WorkWize Logo" class="h-10 mx-auto object-contain" onerror="this.style.display='none'">
        </a>
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Set New Password</h2>
        <p class="text-xs text-slate-500 mt-1" id="resetSubheading">Enter and confirm your new password below.</p>
      </div>

      <!-- Alerts -->
      <div id="resetError" class="hidden mb-4 p-2.5 rounded-xl text-xs font-semibold bg-rose-50 text-rose-600 border border-rose-200 text-center"></div>
      <div id="resetSuccess" class="hidden mb-4 p-3 rounded-xl text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 text-center leading-relaxed"></div>

      <!-- Missing Parameters Warning -->
      <div id="invalidParamsCard" class="hidden text-center space-y-4 py-2">
        <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-xl font-bold">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h3 class="font-bold text-slate-800 text-sm">Invalid or Expired Link</h3>
          <p class="text-xs text-slate-500 mt-1 leading-relaxed">
            This password reset link is invalid or incomplete. Please request a new password reset link from the login page.
          </p>
        </div>
        <div>
          <a href="newtaskmaster/login.html" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition-colors">
            <i class="fa-solid fa-arrow-left"></i> Go to Login
          </a>
        </div>
      </div>

      <!-- Reset Password Form -->
      <form id="resetForm" class="space-y-4" onsubmit="handleReset(event)">
        <!-- Email display -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">User Account</label>
          <div class="relative flex items-center">
            <i class="fa-regular fa-envelope absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="text" 
              id="userAccountDisplay" 
              readonly 
              class="w-full pl-10 pr-3 py-2.5 text-xs bg-slate-100 border border-slate-200 rounded-xl outline-none text-slate-600 font-medium cursor-not-allowed select-none"
            >
          </div>
        </div>

        <!-- New Password Field -->
        <div>
          <label for="newPassword" class="block text-xs font-semibold text-slate-700 mb-1.5">New Password</label>
          <div class="relative flex items-center">
            <i class="fa-solid fa-lock absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="password" 
              id="newPassword" 
              required 
              minlength="6"
              placeholder="Minimum 6 characters"
              class="w-full pl-10 pr-10 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800"
            >
            <button 
              type="button" 
              onclick="togglePwd('newPassword', 'pwdEye1')" 
              class="absolute right-3 text-slate-400 hover:text-slate-600 p-1 text-xs" 
              title="Show/Hide Password"
            >
              <i class="fa-regular fa-eye" id="pwdEye1"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div>
          <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 mb-1.5">Confirm New Password</label>
          <div class="relative flex items-center">
            <i class="fa-solid fa-shield-halved absolute left-3.5 text-slate-400 text-sm pointer-events-none"></i>
            <input 
              type="password" 
              id="confirmPassword" 
              required 
              minlength="6"
              placeholder="Re-enter new password"
              class="w-full pl-10 pr-10 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800"
            >
            <button 
              type="button" 
              onclick="togglePwd('confirmPassword', 'pwdEye2')" 
              class="absolute right-3 text-slate-400 hover:text-slate-600 p-1 text-xs" 
              title="Show/Hide Password"
            >
              <i class="fa-regular fa-eye" id="pwdEye2"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="resetBtn"
            class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs font-semibold rounded-xl shadow-md shadow-blue-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
          >
            <i class="fa-solid fa-check text-xs"></i>
            <span>Set New Password</span>
          </button>
        </div>
      </form>

      <!-- Back to Login Link -->
      <div class="my-5 border-t border-slate-100"></div>

      <div class="text-center">
        <a href="newtaskmaster/login.html" class="text-xs text-blue-600 hover:text-blue-800 font-semibold inline-flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-arrow-left text-[11px]"></i>
          <span>Back to Login</span>
        </a>
      </div>

    </div>

  </div>

  <script src="newtaskmaster/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid') || urlParams.get('email') || '';
    const token = urlParams.get('token') || '';

    window.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('resetForm');
      const invalidCard = document.getElementById('invalidParamsCard');
      const accountInput = document.getElementById('userAccountDisplay');

      if (!uid || !token) {
        if (form) form.classList.add('hidden');
        if (invalidCard) invalidCard.classList.remove('hidden');
      } else {
        if (accountInput) accountInput.value = uid;
      }
    });

    function togglePwd(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value.trim();
      const confirmPass = document.getElementById('confirmPassword').value.trim();
      const err = document.getElementById('resetError');
      const success = document.getElementById('resetSuccess');
      const btn = document.getElementById('resetBtn');
      const form = document.getElementById('resetForm');

      if (!newPass || !confirmPass) {
        err.innerText = 'Please enter both password fields.';
        err.classList.remove('hidden');
        return;
      }

      if (newPass.length < 6) {
        err.innerText = 'Password must be at least 6 characters.';
        err.classList.remove('hidden');
        return;
      }

      if (newPass !== confirmPass) {
        err.innerText = 'Passwords do not match. Please verify.';
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      success.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-xs"></i> <span>Updating Password...</span>';

      try {
        let response = null;
        if (typeof WorkWizeAPI !== 'undefined' && WorkWizeAPI.confirmResetPassword) {
          response = await WorkWizeAPI.confirmResetPassword(uid, token, newPass);
        } else {
          const fd = new FormData();
          fd.append('uid', uid.trim());
          fd.append('token', token.trim());
          fd.append('pass', newPass);
          const res = await fetch('https://oprofase2.workarya.com/api/it/resetpassword', {
            method: 'POST',
            body: fd
          });
          try {
            response = await res.json();
          } catch (_) {
            response = res.ok;
          }
        }

        if (response === true || response?.success === true || response?.status === true) {
          form.classList.add('hidden');
          success.innerHTML = `
            <div class="flex flex-col items-center gap-2 py-2">
              <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg font-bold">
                <i class="fa-solid fa-check"></i>
              </div>
              <h3 class="font-bold text-slate-800 text-sm">Password Reset Complete!</h3>
              <p class="text-xs text-slate-600 leading-relaxed">Your password has been successfully updated. You can now log in with your new password.</p>
              <a href="newtaskmaster/login.html" class="mt-2 inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition-colors shadow-sm">
                <span>Go to Login</span>
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </a>
            </div>
          `;
          success.classList.remove('hidden');
        } else {
          throw new Error('Failed to reset password. The link may have expired or is invalid.');
        }
      } catch (error) {
        err.innerText = error.message || 'An error occurred while resetting your password. The link may have expired.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> <span>Set New Password</span>';
      }
    }
  </script>
</body>
</html>
